<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound Events</title>
  <style>
    :root {
      color-scheme: light;
      --page:           #f9f9f7;
      --surface-1:      #fcfcfb;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --text-muted:     #898781;
      --gridline:       #e1e0d9;
      --baseline:       #c3c2b7;
      --border:         rgba(11, 11, 11, 0.10);
      --series-1:       #2a78d6;
    }
    /* Dark values are declared under both scopes: the OS setting, and an
       explicit data-theme="dark" stamp (a light stamp beats OS-dark). */
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --page:           #0d0d0d;
        --surface-1:      #1a1a19;
        --text-primary:   #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted:     #898781;
        --gridline:       #2c2c2a;
        --baseline:       #383835;
        --border:         rgba(255, 255, 255, 0.10);
        --series-1:       #3987e5;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255, 255, 255, 0.10);
      --series-1:       #3987e5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--page);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main { max-width: 960px; margin: 0 auto; }

    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
    .subtitle { margin: 0 0 16px; color: var(--text-secondary); font-size: 14px; }

    .card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    #status { color: var(--text-muted); font-size: 13px; }

    button {
      font: inherit;
      font-size: 13px;
      color: var(--text-primary);
      background: transparent;
      border: 1px solid var(--baseline);
      border-radius: 8px;
      padding: 6px 12px;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
    }
    button:hover { background: var(--gridline); }

    #chart { position: relative; }
    #chart svg { display: block; width: 100%; height: auto; }
    .empty { margin: 48px 0; text-align: center; color: var(--text-secondary); }

    /* Chart marks and chrome. Marks carry the series color; text uses text tokens. */
    .grid line { stroke: var(--gridline); stroke-width: 1; }
    .axis text { fill: var(--text-muted); font-size: 12px; }
    .axis .domain { stroke: var(--baseline); }
    .axis-title { fill: var(--text-secondary); font-size: 12px; }
    .series-line {
      fill: none;
      stroke: var(--series-1);
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
    .peak-label { fill: var(--text-secondary); font-size: 12px; }
    .crosshair { stroke: var(--baseline); stroke-width: 1; }
    .focus-dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
    .overlay { fill: transparent; }

    .tooltip {
      position: absolute;
      pointer-events: none;
      transform: translate(14px, -50%);
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      white-space: nowrap;
    }
    .tooltip.flip { transform: translate(calc(-100% - 14px), -50%); }
    .tip-value { display: flex; align-items: center; gap: 8px; font-size: 16px; }
    .tip-value strong { font-weight: 600; color: var(--text-primary); }
    .tip-key { width: 12px; height: 2px; background: var(--series-1); }
    .tip-time { margin-top: 2px; font-size: 12px; color: var(--text-secondary); }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    caption { text-align: left; color: var(--text-secondary); padding-bottom: 8px; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--gridline); }
    th { color: var(--text-secondary); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Sound events</h1>
    <p class="subtitle">Peak amplitude each time the microphone crossed the trigger threshold.</p>

    <section class="card">
      <div class="toolbar">
        <span id="status" role="status">Loading…</span>
        <button id="view-toggle" type="button" aria-pressed="false">Table view</button>
      </div>
      <div id="chart"></div>
      <div id="table-wrap" hidden></div>
    </section>
  </main>

  <script src="/vendor/d3/d3.min.js"></script>
  <script type="module" src="/chart.js"></script>
</body>
</html>
